name: Build & Release

on:
  push:
    branches: [main, master]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/build.yml"
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Direct pushes to main only run the unit tests — a fast gate. The full app +
  # DMG build for both CPU variants happens once, on the release tag (below), so
  # a version-bump commit and its tag don't compile the app twice on the same SHA.
  test:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Engine-dependent checks (e.g. LiveWindowTruthTests pin the ubatch default
      # against the bundled llama-server) need the vendored engines on disk. The
      # engines job below caches them; building here first keeps the fast gate
      # honest on pushes (found when Merlin's wave made CI run the full suite —
      # the check dates to Census W5-5 but main pushes never built engines first).
      - name: Build inference engines (fast-gate prerequisite)
        run: |
          if [ ! -x vendor/llama.cpp/build-static/bin/llama-server ]; then
            ARCH=x86_64 ./scripts/build-engines.sh
          else
            echo "Using cached inference engines"
          fi
      - run: swift run --disable-sandbox kestrel-checks

  build:
    # PRs validate a single variant; tags and manual runs build BOTH CPU variants
    # (standard = AVX2, noavx2 = pre-AVX2 legacy) and ship a DMG for each. Branch
    # pushes are handled by the test job above, so build is skipped for them.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    name: Build ${{ matrix.variant }} (x86_64)
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && fromJSON('["standard","noavx2"]') || fromJSON('["standard"]') }}
    env:
      # The no-AVX2 leg lowers the CPU baseline in build-engines.sh and stamps the
      # bundle (make-app.sh) so the updater keeps it on its own release channel.
      KESTREL_NO_AVX2: ${{ matrix.variant == 'noavx2' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect documentation-only PR
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Ev '(^|/).*\.md$|^\.github/|^LICENSE$|^\.gitignore$' >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache engine builds
        if: github.event_name != 'pull_request' || steps.scope.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: vendor
          # Per variant: the two ISA baselines produce different engine binaries.
          key: engines-${{ matrix.variant }}-${{ hashFiles('patches/**/*.patch', 'scripts/build-engines.sh') }}

      - name: Run unit tests
        if: github.event_name == 'pull_request' && steps.scope.outputs.build == 'true'
        run: swift run --disable-sandbox kestrel-checks

      - name: Build inference engines (x86_64)
        if: github.event_name != 'pull_request' || steps.scope.outputs.build == 'true'
        run: |
          if [ ! -x vendor/llama.cpp/build-static/bin/llama-server ] || \
             [ ! -f vendor/llama.cpp/build-static/bin/default.metallib ] || \
             [ ! -x vendor/whisper.cpp/build-static/bin/whisper-cli ] || \
             [ ! -f vendor/whisper.cpp/build-static/bin/default.metallib ] || \
             [ ! -x vendor/stable-diffusion.cpp/build-static/bin/sd-cli ] || \
             [ ! -f vendor/stable-diffusion.cpp/build-static/bin/default.metallib ]; then
            ARCH=x86_64 ./scripts/build-engines.sh
          else
            echo "Using cached inference engines"
          fi

      - name: Build app (x86_64)
        if: github.event_name != 'pull_request' || steps.scope.outputs.build == 'true'
        run: KESTREL_ARCH=x86_64 ./make-app.sh

      # Version truth gate (audit G5): a tag whose bundle disagrees with it is
      # exactly the v0.90.0 regression — bundle 0.89.17, tag v0.90.0 — which
      # made the updater silently deaf for every 0.90.0 install.
      - name: Assert version truth (tag == bundle == source)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Kestrel.app/Contents/Info.plist)
          SRC=$(sed -n 's/.*versionFallback = "\([^"]*\)".*/\1/p' Sources/App/AboutTab.swift | head -1)
          [ "$TAG" = "$PLIST" ] || { echo "::error::tag v$TAG != bundle version $PLIST (the v0.90.0 regression)"; exit 1; }
          [ "$TAG" = "$SRC" ] || { echo "::error::tag v$TAG != stamped versionFallback $SRC"; exit 1; }
          echo "version truth: tag == bundle == source ($TAG)"

      # Distribution policy (2026-11-16, operator decision): UNSIGNED ad-hoc
      # builds. There is no Apple Developer ID on this project — the Developer-ID
      # signing + notarization pipeline that used to live here presumed one that
      # never existed, and hard-failed every tag build. Integrity is the published
      # SHA-256 checksums; the ad-hoc signature from make-app.sh makes the bundle
      # loadable and lets the updater verify update-to-update consistency; the
      # README documents the one-time "Open Anyway" first-open step. In-app
      # self-updates carry no browser quarantine (KES-09) and install seamlessly.
      - name: Verify ad-hoc bundle signature
        run: codesign --verify --deep --strict dist/Kestrel.app

      # The DMG is only consumed by releases; packaging + uploading it on every
      # push/PR just burns time and artifact storage. Only tags and manual runs
      # ship a DMG. make-dmg.sh reads the bundle's variant to name it (-noavx2).
      - name: Package DMG
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" == v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          ./scripts/make-dmg.sh "$VERSION"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.variant }}
          path: dist/*.dmg

  # Collect both variants' DMGs and publish one release with both assets, so the
  # updater can pick the matching one per install (AppInfo.isNoAVX2).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    name: Publish release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built DMGs
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dmg-*
          merge-multiple: true

      - name: Checksums
        run: (cd dist && shasum -a 256 *.dmg > checksums.txt && cat checksums.txt)

      # Pull the section for this tag's version out of CHANGELOG.md so the
      # release body shows the human-written notes; generate_release_notes then
      # appends the auto commit/PR list under it.
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section; stamp the Unreleased header before tagging (scripts/release.sh does it)"
            exit 1
          fi
          echo "----- release body -----"; cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/checksums.txt
          body_path: release-notes.md
          generate_release_notes: true
